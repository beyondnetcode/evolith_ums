# SonarCloud — monorepo evolith-ums (satélite Evolith)
sonar.projectKey=evolith-ums
sonar.projectName=evolith-ums
sonar.projectVersion=1.0.0

# Fuentes y pruebas (rutas reales del monorepo)
sonar.sources=apps
sonar.tests=apps
sonar.test.inclusions=apps/**/*.spec.ts,apps/**/*.test.ts,apps/**/*.test.tsx,apps/**/*.spec.tsx
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/bin/**,**/obj/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.tsx,apps/ums.web-app/vite.config.ts

# Cobertura del frontend (TS). La cobertura .NET (apps/ums.api) requiere el
# scanner MSBuild de SonarCloud; su activación se registra en G-016.
sonar.javascript.lcov.reportPaths=apps/ums.web-app/coverage/lcov.info

# Codificación de origen
sonar.sourceEncoding=UTF-8
