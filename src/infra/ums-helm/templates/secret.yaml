{{- /*
  Secretos que el chart consume (G-019). Antes había que crearlos a mano
  (`kubectl create secret generic ums-db-secret ...`), así que un `helm install`
  limpio dejaba el backend y Postgres sin credenciales. Ahora el chart los
  plantilla y es autocontenido.

  En producción, sobreescribe los valores con `--set`/values cifrado, o
  gestiona los secretos fuera del chart con `secrets.create=false`.

  La CONNECTION_STRING se deriva de la misma contraseña que POSTGRES_PASSWORD
  para que no puedan divergir.

  Y se plantilla SEGÚN EL MOTOR (G-281). Antes solo sabía escribir la sintaxis de
  Npgsql —`Host=…;Username=…`—, de modo que un despliegue con
  `backend.persistenceProvider=SqlServer` arrancaba con el proveedor de SQL Server
  y una cadena de PostgreSQL: `Keyword not supported: 'host'`. Y como el chart
  reescribe el secreto en cada `upgrade`, ponerlo a mano tampoco servía —el
  siguiente despliegue lo devolvía a Postgres—. Con `secrets.create=false` el
  chart no lo toca y la cadena la gobierna quien la custodia.
*/ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: ums-db-secret
  labels:
    app.kubernetes.io/name: ums-helm
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # NO se marca como hook, y conviene decir por que se intento (G-282). El Job de migracion es
    # `pre-upgrade`, asi que corre ANTES de que este manifiesto se aplique y hereda la cadena de la
    # revision anterior: cambiar de motor exige por eso aplicar el secreto primero. Anotarlo como
    # hook parecia la salida y es peor: Helm deja de tratarlo como recurso del release, lo poda al
    # dejar de estar en los manifiestos y los pods se quedan SIN secreto —medido: todas las replicas
    # en `CreateContainerConfigError`, `secret "ums-db-secret" not found`—. Una credencial que
    # sostiene pods vivos no puede tener el ciclo de vida de un hook.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.db.postgresPassword | quote }}
  CONNECTION_STRING: {{ include "ums-helm.cadenaDeConexion" . | quote }}
---
{{- /*
  Copia EFIMERA de la cadena, solo para el Job de migracion (G-282).

  El Job es un hook `pre-upgrade` y Helm aplica los hooks ANTES que los manifiestos normales, asi
  que leia `ums-db-secret` en su version ANTERIOR: cambiar de motor migraba contra la base vieja y
  moria con `Keyword not supported: 'host'`. Marcar el secreto compartido como hook lo arreglaba y
  rompia algo peor —Helm lo podaba y las replicas se quedaban sin credencial—, asi que lo que se
  vuelve hook es esta COPIA, con peso -10 para llegar antes que el Job (-5) y borrado al terminar.
  El secreto que sostiene pods vivos sigue siendo un recurso normal del release.

  Las dos salen del mismo ayudante: no pueden divergir.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: ums-db-secret-migracion
  labels:
    app.kubernetes.io/name: ums-helm
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    componente: migracion
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
type: Opaque
stringData:
  CONNECTION_STRING: {{ include "ums-helm.cadenaDeConexion" . | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ums-admin-secret
  labels:
    app.kubernetes.io/name: ums-helm
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  ADMIN_PASSWORD: {{ .Values.secrets.admin.password | quote }}
{{- if or .Values.secrets.jwt.secret .Values.secrets.jwt.privateKeyPem }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ums-jwt-secret
  labels:
    app.kubernetes.io/name: ums-helm
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- if .Values.secrets.jwt.secret }}
  JWT_SECRET: {{ .Values.secrets.jwt.secret | quote }}
  {{- end }}
  {{- if .Values.secrets.jwt.privateKeyPem }}
  # La clave de firma RS256. Va en el MISMO Secret que la simetrica y no en uno
  # aparte: son el mismo material de firma en dos etapas de la misma migracion
  # (ADR-0157 §4.9), y separarlos invita a rotar una y olvidar la otra.
  JWT_PRIVATE_KEY_PEM: |-
{{ .Values.secrets.jwt.privateKeyPem | indent 4 }}
  {{- end }}
{{- end }}
{{- end }}
