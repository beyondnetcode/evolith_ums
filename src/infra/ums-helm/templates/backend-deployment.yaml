apiVersion: apps/v1
kind: Deployment
metadata:
  name: ums-backend
  labels:
    app: ums-backend
spec:
  # G-169: parametrizado. Estaba escrito a mano y `replicaCount` de values.yaml no lo leía nadie,
  # así que pedir dos pods exigía editar este fichero.
  #
  # Con autoescalado encendido, `replicas` se OMITE a propósito: dejarlo pelearía con el HPA en
  # cada `helm upgrade` —Helm lo devuelve a su valor, el HPA lo vuelve a mover— y el número de pods
  # oscilaría sin que nadie entienda por qué.
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  # Una actualización no debe dejar a UMS sin ningún pod sirviendo. `maxUnavailable: 0` retiene el
  # pod viejo hasta que el nuevo pasa su sonda de disponibilidad.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ums-backend
  template:
    metadata:
      labels:
        app: ums-backend
    spec:
      containers:
        - name: ums-backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              # G-127: entorno parametrizable. Development expone backdoors (DevAuth, endpoint Pact,
              # Swagger); UAT los apaga pero conserva la siembra del dataset FS-25 (SeedDevData va por
              # Persistence__SeedDevData, desacoplado del entorno). Overlay UAT: values-uat.yaml.
              value: {{ .Values.backend.environment | default "Development" }}
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: ums-db-secret
                  key: CONNECTION_STRING
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ums-admin-secret
                  key: ADMIN_PASSWORD
            # La clave con la que UMS firma sus tokens. Hasta hoy no se inyectaba
            # ninguna, asi que lo desplegado firmaba con el marcador de posicion
            # de `appsettings.json` -- una cadena publica y versionada con la que
            # cualquiera podia emitir tokens de cualquier usuario (G-203).
            #
            # `optional: true` a proposito: si el Secret no existe, la variable no
            # se define y el arranque FALLA nombrando el problema, en vez de que
            # el pod se quede en CreateContainerConfigError sin explicar nada.
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: ums-jwt-secret
                  key: JWT_SECRET
                  optional: true
            # La clave PRIVADA RSA con la que se firma en RS256 (ADR-0157).
            #
            # Sin ella cada replica genera la suya al arrancar y publica en su
            # JWKS solo la propia: un token emitido por una replica NO verifica
            # contra el JWKS que responde otra. Con dos replicas es la mitad de
            # los tokens, de forma intermitente. El respaldo efimero de
            # `MaterialDeFirma` sirve para UN proceso, no para un Deployment.
            - name: Jwt__PrivateKeyPem
              valueFrom:
                secretKeyRef:
                  name: ums-jwt-secret
                  key: JWT_PRIVATE_KEY_PEM
                  optional: true
            # ADR-UMS-102: el motor relacional es elegible. `PostgreSql` (defecto) usa el Postgres
            # del chart; `SqlServer` exige que `ums-db-secret/CONNECTION_STRING` apunte a un SQL
            # Server 2019+ EXTERNO —el chart no despliega uno— y que se apague `postgres.enabled`.
            - name: Persistence__Provider
              value: {{ .Values.backend.persistenceProvider | default "PostgreSql" | quote }}
            # Postura del aspecto de autorizacion (G-280). Sin valor, el aspecto APLICA: los 182
            # manejadores guardados deniegan a toda identidad sin el permiso, y el borde lo
            # traduce a 401. `AuditOnly` evalua y registra sin denegar, que es la pasada que el
            # plan escalonado pide ANTES de aplicar —desplegar auditando, leer del registro que
            # scopes faltan, concederlos, y solo entonces aplicar—. Se deja SIN valor por
            # defecto: cambiar la postura de seguridad de todo despliegue desde una plantilla,
            # y de forma silenciosa, seria peor que el gap que documenta.
            # SIEMPRE se emite: si el manifiesto no la lleva, la postura la decide el valor por
            # omision del binario y no hay donde leerla.
            - name: Authorization__Mode
              value: {{ .Values.backend.authorizationMode | default "Enforce" | quote }}
            # El atajo de Admin Root (ADR-0071): con `true` —el valor por omision del codigo— toda
            # cuenta del inquilino propietario pasa los 182 manejadores guardados sin evaluar un
            # solo scope. Se expone para poder APAGARLO por configuracion, que es el ultimo paso de
            # G-280 y el unico momento en que UMS se aplica a si mismo lo que exige a los demas.
            # Vacio = se respeta el valor del codigo; no se decide la postura desde la plantilla.
            # SIEMPRE se emite, por la misma razon: el defecto del codigo es ENCENDIDO, asi que
            # callar aqui es desplegar con el atajo puesto sin que ningun manifiesto lo diga.
            - name: Authorization__InternalAdminBypass
              value: {{ .Values.backend.internalAdminBypass | default "false" | quote }}
            - name: Persistence__UsePostgreSqlIdentityStores
              value: "true"
            - name: Persistence__UsePostgreSqlAuthorizationStores
              value: "true"
            - name: Persistence__UsePostgreSqlConfigurationStores
              value: "true"
            - name: Persistence__UsePostgreSqlApprovalsStores
              value: "true"
            - name: Persistence__UsePostgreSqlIgaStores
              value: "true"
            # G-169: con el Job de migración encendido, la base llega ya migrada y sembrada, y las
            # réplicas NO lo repiten. Apagarlo devuelve el comportamiento anterior —cada réplica
            # migra al arrancar—, que solo es seguro con una sola réplica.
            - name: Persistence__InitializePlatformStoreOnStartup
              value: {{ if .Values.backend.migrationJob.enabled }}"false"{{ else }}"true"{{ end }}
            - name: Persistence__SeedDevData
              value: {{ if .Values.backend.migrationJob.enabled }}"false"{{ else }}"true"{{ end }}
            - name: REDIS_CONNECTION
              value: redis://ums-redis:6379
            # Observabilidad (ADR-0046): trazas+métricas por OTLP gRPC al colector;
            # logs directamente a Loki por el sink Serilog. Los valores provienen de
            # values.yaml (.Values.observability.*).
            - name: Observability__Tracing__OtlpEndpoint
              value: {{ .Values.observability.otlpEndpoint | quote }}
            - name: Observability__Tracing__ServiceVersion
              value: "1.0.0"
            - name: Observability__Logging__LokiEndpoint
              value: {{ .Values.observability.lokiEndpoint | quote }}
            - name: Observability__Logging__LokiAppLabel
              value: ums-api
            - name: Observability__Logging__LokiEnvLabel
              value: kind
          ports:
            - containerPort: 8080
          # Sin `requests` el HPA no tiene contra qué calcular el porcentaje de CPU y no escala
          # nunca; sin `limits` un pod con fuga se lleva por delante al nodo entero.
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # Probes tolerantes: en entornos locales con recursos ajustados los
          # health checks (que tocan DB/Redis) pueden superar el timeout por
          # defecto de 1s bajo presión de CPU y disparar un CrashLoop. Timeout y
          # failureThreshold holgados evitan matar un backend que solo va lento.
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
