{{- if .Values.observability.enabled }}
# ══════════════════════════════════════════════════════════════════════════════
# Stack de observabilidad (ADR-0046 / ADR-0007): colector OpenTelemetry + Loki +
# Tempo + Prometheus + Grafana. Reutiliza las configuraciones de
# src/infra/local/compose/docker/observability adaptadas a nombres de Service de k8s.
#
# Flujo de señales:
#   - Trazas  : backend --OTLP gRPC--> otel-collector:4317 --> tempo:4317
#   - Métricas: backend --OTLP gRPC--> otel-collector:4317 --> exporter :8889 (scrape Prometheus)
#   - Logs    : backend --Serilog GrafanaLoki--> loki:3100 (directo, sin colector)
# ══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  otel-collector-config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        send_batch_size: 1024
        timeout: 5s
      memory_limiter:
        check_interval: 5s
        limit_mib: 256
        spike_limit_mib: 64
    exporters:
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
    service:
      extensions:
        - health_check
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.observability.images.otelCollector }}
          args: ["--config=/etc/otel/otel-collector-config.yaml"]
          resources:
{{ toYaml .Values.observability.resources | indent 12 }}
          ports:
            - containerPort: 4317
            - containerPort: 4318
            - containerPort: 8889
            - containerPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otel
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prom-metrics
      port: 8889
      targetPort: 8889
---
# ── Loki (logs) ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    app: loki
data:
  loki-config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    pattern_ingester:
      enabled: true
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: {{ .Values.observability.images.loki }}
          args: ["-config.file=/etc/loki/loki-config.yaml"]
          resources:
{{ toYaml .Values.observability.resources | indent 12 }}
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
---
# ── Tempo (trazas) ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels:
    app: tempo
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 24h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal
    overrides:
      defaults:
        metrics_generator:
          processors: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    app: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: {{ .Values.observability.images.tempo }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          resources:
{{ toYaml .Values.observability.resources | indent 12 }}
          ports:
            - containerPort: 3200
            - containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    app: tempo
spec:
  selector:
    app: tempo
  ports:
    - name: tempo-http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
# ── Prometheus (métricas) ──────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    # D-R3 / TE-09: reglas de alerta básicas del piloto (ver alert.rules.yml).
    rule_files:
      - /etc/prometheus/alert.rules.yml
    # Enrutamiento de alertas a Alertmanager (agrupación, deduplicación, silencios y
    # notificación). Prometheus solo evalúa y dispara; Alertmanager decide a quién avisar.
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093
    scrape_configs:
      - job_name: otel-collector
        honor_labels: true
        static_configs:
          - targets:
              - otel-collector:8889
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
  # Alertas básicas del piloto (D-R3 de TE-09 / G-077). Solo métricas que EXISTEN de
  # verdad (OTel del backend vía otel-collector:8889): no se inventan series. La salud
  # de PostgreSQL/Redis no tiene exporter propio → se verifica por el `/health` del
  # backend (RB-05), no por una alerta de una métrica inexistente. Estas reglas hacen
  # que Prometheus marque las alertas como `firing` (visibles en su UI y en Grafana);
  # el enrutamiento/notificación (Alertmanager) es un incremento posterior.
  alert.rules.yml: |
    groups:
      - name: ums-pilot
        rules:
          - alert: UmsBackendMetricsAbsent
            expr: absent(http_server_request_duration_seconds_count)
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "El backend UMS no emite métricas (posible caída)"
              description: "No hay `http_server_request_duration_seconds_count` desde hace 5m: el backend está caído o no sirve peticiones."
              runbook: "reference/operaciones/runbooks/rb-01-respuesta-incidentes.md"
          - alert: UmsScrapeTargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Un objetivo de scrape de Prometheus está caído"
              description: "`up == 0` para algún objetivo (otel-collector o prometheus) durante 5m."
              runbook: "reference/operaciones/runbooks/rb-01-respuesta-incidentes.md"
          - alert: UmsHighErrorRate
            expr: >
              100 * sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
              / sum(rate(http_server_request_duration_seconds_count[5m])) > 5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Tasa de errores 5xx del backend > 5%"
              description: "La proporción de respuestas 5xx supera el 5% durante 10m. Considerar rollback (RB-02)."
              runbook: "reference/operaciones/runbooks/rb-02-procedimiento-rollback.md"
          - alert: UmsHighLatencyP95
            expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)) > 1.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Latencia p95 del backend > 1.5s"
              description: "El p95 de duración de peticiones supera 1.5s durante 10m."
              runbook: "reference/operaciones/runbooks/rb-01-respuesta-incidentes.md"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.observability.images.prometheus }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          resources:
{{ toYaml .Values.observability.resources | indent 12 }}
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
# ── Alertmanager (enrutamiento y notificación de alertas) ──────────────────────
# D-R3 de TE-09 / G-077: cierra la capa de alertado. Prometheus dispara; Alertmanager
# agrupa, deduplica, aplica silencios y notifica. El receptor por defecto no envía a
# ningún canal (webhookUrl vacío): las alertas quedan visibles/agrupadas en su UI hasta
# que el operador configure un webhook real (RB-05).
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: default
        {{- if .Values.observability.alertmanager.webhookUrl }}
        webhook_configs:
          - url: {{ .Values.observability.alertmanager.webhookUrl | quote }}
            send_resolved: true
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: {{ .Values.observability.images.alertmanager }}
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          resources:
{{ toYaml .Values.observability.resources | indent 12 }}
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels:
    app: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
---
# ── Grafana (visualización) ────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          serviceMap:
            datasourceUid: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  labels:
    app: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: ums
        orgId: 1
        folder: UMS
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  ums-overview.json: |
{{ .Files.Get "dashboards/ums-overview.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.observability.images.grafana }}
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_USERS_DEFAULT_THEME
              value: "light"
            # Servido bajo /grafana/ detrás del nginx del frontend, para que la
            # barra de navegación enlace a la observabilidad de la zona de
            # autorización bajo el mismo origen (ver nginx.conf.template).
            - name: GF_SERVER_ROOT_URL
              value: {{ .Values.observability.grafana.rootUrl | quote }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          resources:
{{ toYaml .Values.observability.resources | indent 12 }}
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  type: {{ .Values.observability.grafana.service.type }}
  selector:
    app: grafana
  ports:
    - port: {{ .Values.observability.grafana.service.port }}
      targetPort: 3000
      {{- if eq .Values.observability.grafana.service.type "NodePort" }}
      nodePort: {{ .Values.observability.grafana.service.nodePort }}
      {{- end }}
{{- end }}
